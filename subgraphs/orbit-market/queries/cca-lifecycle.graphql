query CcaLifecycle($block: Block_height) {
  _meta(block: $block) {
    block {
      number
      hash
      timestamp
    }
    hasIndexingErrors
    deployment
  }
  auctionBidSubmissions(
    block: $block
    first: 100
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    bidId
    owner
    priceQ96
    amount
    blockNumber
    timestamp
  }
  auctionBidExits(
    block: $block
    first: 100
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    bidId
    owner
    tokensFilled
    currencyRefunded
    blockNumber
    timestamp
  }
  auctionTokenClaims(
    block: $block
    first: 100
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    bidId
    owner
    tokensFilled
    blockNumber
    timestamp
  }
  ccaMigrations(
    block: $block
    first: 20
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    initializer
    poolKeyHash
    initialSqrtPriceX96
    plan
    blockNumber
    timestamp
  }
  ccaMigrationFailures(
    block: $block
    first: 20
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    initializer
    reason
    blockNumber
    timestamp
  }
  ccaFundsRecoveries(
    block: $block
    first: 20
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    initializer
    recipient
    amount
    blockNumber
    timestamp
  }
  ccaActivations(
    block: $block
    first: 20
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    governanceOwner
    blockNumber
    timestamp
  }
  ccaEscrows(
    block: $block
    first: 100
    orderBy: createdBlockNumber
    orderDirection: asc
  ) {
    id
    beneficiary
    createdHash
    createdLogIndex
    createdBlockNumber
    createdTimestamp
  }
  ccaEscrowWithdrawals(
    block: $block
    first: 100
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    escrow {
      id
      beneficiary
    }
    token
    beneficiary
    amount
    blockNumber
    timestamp
  }
}
