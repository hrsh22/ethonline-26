specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PoolManager
    network: base-sepolia
    source:
      address: "0x05E73354cFDd6745C338b50BcFDfA3Aa6fA03408"
      abi: PoolManager
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
        - event: ModifyLiquidity(indexed bytes32,indexed address,int24,int24,int256,bytes32)
          handler: handleModifyLiquidity
        - event: Donate(indexed bytes32,indexed address,uint256,uint256)
          handler: handleDonate
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: CanonicalFeeHook
    network: base-sepolia
    source:
      address: "0x9323c22e7BFC65B3f4693f778A4e68A0752980cC"
      abi: CanonicalFeeHook
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: CanonicalFeeHook
          file: ./abis/CanonicalFeeHook.json
      eventHandlers:
        - event: FeeAccrued(indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleFee
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: EpochConverter
    network: base-sepolia
    source:
      address: "0x029D0c980b8997396DeE69d2a8B9dF046783147E"
      abi: EpochConverter
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: EpochConverter
          file: ./abis/EpochConverter.json
      eventHandlers:
        - event: RewardEpochOpened(indexed uint256,uint256,uint256,uint256)
          handler: handleEpoch
        - event: TrackExecuted(indexed uint8,uint256,uint256,uint256)
          handler: handleConversion
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: RewardLedger
    network: base-sepolia
    source:
      address: "0xE70E620E5A280e87923c6C2466986ae5C4326C13"
      abi: RewardLedger
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: RewardLedger
          file: ./abis/RewardLedger.json
      eventHandlers:
        - event: RewardNotified(indexed uint8,indexed address,uint256,uint256,uint256,uint256)
          handler: handleDistribution
        - event: RewardClaimed(indexed address,indexed uint16,indexed uint8,uint256)
          handler: handleClaim
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: GenesisLiquidityVault
    network: base-sepolia
    source:
      address: "0x766A8a55F2943ADa722D0e9E5f848c471C7b04A6"
      abi: GenesisLiquidityVault
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: GenesisLiquidityVault
          file: ./abis/GenesisLiquidityVault.json
      eventHandlers:
        - event: GenesisLiquiditySeeded(indexed bytes32,uint128,uint256,uint256,int24,int24)
          handler: handleGenesis
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: ProtocolLiquidityVault
    network: base-sepolia
    source:
      address: "0x187eE0795b8dFd8110707A1843AAad62C2722535"
      abi: ProtocolLiquidityVault
      startBlock: 46351953
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [LiquidityPool, Swap, RewardFundingSummary]
      abis:
        - name: ProtocolLiquidityVault
          file: ./abis/ProtocolLiquidityVault.json
      eventHandlers:
        - event: ProtocolLiquidityAdded(indexed uint256,indexed bytes32,uint256,uint256,uint256,uint256,int24,int24,uint128)
          handler: handleLiquidity
      file: ./src/mapping.ts
