[profile.default]
auto_detect_solc = false
evm_version = "cancun"
fs_permissions = [
  { access = "read", path = "../config/collection" },
  { access = "read-write", path = "../../deployments" },
]
optimizer = true
optimizer_runs = 200
out = "out"
remappings = [
  "@chainlink/contracts/=lib/chainlink-evm/contracts/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts@4.9.6/=lib/openzeppelin-contracts-4.9.6/contracts/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
]
script = "script"
solc_version = "0.8.26"
src = "src"
test = "test"

[fmt]
line_length = 100
sort_imports = true

[invariant]
depth = 32
fail_on_revert = false
runs = 64
show_metrics = true
shrink_run_limit = 5000
