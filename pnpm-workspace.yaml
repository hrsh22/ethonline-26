packages:
  - apps/*
  - packages/*
allowBuilds:
  "@reown/appkit": true
  bufferutil: false
  keccak: false
  unrs-resolver: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - "@next/env@16.3.3"
  - "@next/eslint-plugin-next@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-darwin-x64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"
  - "@tanstack/query-core@5.102.5"
  - "@tanstack/react-query@5.102.5"
  - eslint-config-next@16.3.3
  - next@16.3.3
overrides:
  axios: 1.18.0
  use-sync-external-store: 1.6.0
patchedDependencies:
  "@coinbase/wallet-sdk@4.3.2": patches/@coinbase__wallet-sdk@4.3.2.patch
  '@privy-io/react-auth@3.40.0': patches/@privy-io__react-auth@3.40.0.patch
  "@tradecanvas/chart@1.1.0": patches/@tradecanvas__chart@1.1.0.patch
  "@tradecanvas/core@1.1.0": patches/@tradecanvas__core@1.1.0.patch
